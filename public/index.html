<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <title>Panel TTS</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <link rel="stylesheet" href="/css/style.css?v=1.5">
    
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    
    <div class="status-banner waiting" id="status-banner">
        <span id="banner-icon">🟡</span>
        <span id="banner-text">Haz clic aquí para activar el audio</span>
    </div>

    <div id="control-panel">
        
        <div style="display: flex; gap: 10px; width: 100%;">
            <button id="btnLimpieza" class="btn-panico btn-limpieza" style="flex: 1;">🧹 Limpieza de Emergencia</button>
            <button id="btnApagar" class="btn-panico btn-apagado" style="flex: 1;">🛑 Apagar Servidor</button>
        </div>

        <div class="layout-columnas">
            
            <div class="columna-izq">
                <div class="header-panel">
                    <h3>🎛️ Volumen Global</h3>
                    <span id="vol-text" class="valor-texto">100%</span>
                </div>
                <input type="range" id="vol-slider" min="0" max="100" value="100">
                
                <hr>

                <div class="header-panel">
                    <h3>⏱️ Retraso (Delay)</h3>
                    <span id="delay-text" class="valor-texto">3s</span>
                </div>
                <input type="range" id="delay-slider" min="0" max="15" value="3">
                
                <hr>

                <div class="toggles-container">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="check-solo-subs">
                        <span class="checkmark"></span>
                        <span class="label-text">🔒Solo Subs, VIPs y Mods</span>
                    </label>
                </div>

                <hr>

                <div class="mod-container">
                    <div class="card">
                        <h3>Filtro de Palabras</h3>
                        <div class="input-group">
                            <input type="text" id="inputPalabraFiltro" placeholder="Ej: groseria...">
                            <button id="btnAgregarPalabraFiltro" class="btn-primary">Agregar</button>
                        </div>
                        <ul id="listaBlacklistWords" class="mod-list"></ul>
                        <button id="btnLimpiarPalabras" class="btn-danger-outline">Limpiar Todo</button>
                    </div>

                    <div class="card">
                        <h3>Usuarios Bloqueados</h3>
                        <div class="input-group">
                            <input type="text" id="inputUserFiltro" placeholder="Ej: troll123...">
                            <button id="btnAgregarUserFiltro" class="btn-primary">Bloquear</button>
                        </div>
                        <ul id="listaBlacklistUsers" class="mod-list"></ul>
                    </div>
                </div>
            </div>


            <div class="columna-der">
                <div class="card card-cola">
                    <h3>📋 Cola de TTS Pendientes</h3>
                    <ul id="listaColaTTS" class="mod-list">
                        <li style="color: var(--text-muted); justify-content: center; border:none; background:transparent;">Cola vacía</li>
                    </ul>
                </div>
            </div>

        </div>
    </div>
    <script src="js/socketLogic.js?v=1.0"></script>
</body>
</html>
